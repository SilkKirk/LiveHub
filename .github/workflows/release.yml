name: Release

# Tagging is what publishes: `git tag v0.2.0 && git push origin v0.2.0` builds an APK
# and attaches it to a GitHub Release. The tag push is the only manual step.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v0.2.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  publish:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # `secrets` is not available inside a step-level `if:` expression (the workflow
      # would fail validation), so it is lifted into the env context first.
      KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=LiveHub ${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 37.2
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK_ROOT" ANDROID_HOME="$SDK_ROOT"
          SDKM="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager -type f 2>/dev/null | sort | tail -n1 || true)"
          if [ -n "$SDKM" ]; then
            yes 2>/dev/null | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-37.2" "build-tools;37.0.0" "platform-tools" >/dev/null || true
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      # A release keystore is optional. Without one the debug APK is published instead:
      # it is still installable, just signed with the throwaway debug key.
      - name: Configure release signing
        id: signing
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > livehub-release.jks
            {
              echo "storeFile=../livehub-release.jks"
              echo "storePassword=${STORE_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS}"
              echo "keyPassword=${KEY_PASSWORD}"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore configured."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore; publishing the debug-signed APK."
          fi

      - name: Assemble APK
        id: build
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew :app:assembleRelease --stacktrace
            echo "src=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            ./gradlew :app:assembleDebug --stacktrace
            echo "src=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          SRC="${{ steps.build.outputs.src }}"
          VARIANT="${{ steps.build.outputs.variant }}"
          NAME="LiveHub-${{ steps.meta.outputs.tag }}-${VARIANT}.apk"
          mkdir -p dist
          cp "$SRC" "dist/$NAME"
          SHA="$(sha256sum "dist/$NAME" | cut -d' ' -f1)"
          {
            echo "tag: ${{ steps.meta.outputs.tag }}"
            echo "commit: ${GITHUB_SHA}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "variant: ${VARIANT}"
            echo "sha256: ${SHA}"
          } > "dist/$NAME.sha256.txt"
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"
          ls -la dist
          cat "dist/$NAME.sha256.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          # The tag may already exist (created by hand when cutting the release).
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256.txt
          body: |
            LiveHub 聚合直播客户端 ${{ steps.meta.outputs.tag }}

            支持斗鱼、虎牙、抖音、哔哩哔哩直播，并在同一局域网内于设备之间同步关注列表。

            **安装**：下载下方 APK，在手机上允许「安装未知应用」后安装。
            构建产物的 SHA-256 校验值见 `*.sha256.txt`。

            > 本项目仅供学习与技术交流，直播内容与数据版权归各平台所有。
