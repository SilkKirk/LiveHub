name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # GitHub-hosted runners already ship the Android SDK; only add the
      # components this project needs if they are missing.
      - name: Ensure Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT" ANDROID_HOME="$SDK_ROOT"
          SDKM="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager -type f 2>/dev/null | sort | tail -n1 || true)"
          echo "sdkmanager=$SDKM"
          if [ -n "$SDKM" ]; then
            yes 2>/dev/null | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null || true
          fi
          ls "$SDK_ROOT/platforms" || true
          ls "$SDK_ROOT/build-tools" || true
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload debug apk
        uses: actions/upload-artifact@v4
        with:
          name: spike-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
