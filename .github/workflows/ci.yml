name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep Gradle from writing to the read-only GitHub token path.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

# The three jobs below are independent on purpose: they start together, so a push costs
# as long as the slowest one rather than the sum of all three. Before this split the
# release build sat inside `verify`, and the emulator job waited on `verify` with
# `needs:`, so every green push took lint + tests + debug + R8 + emulator (~10 minutes)
# even though the work itself is ~10 minutes of *runner* time either way.
#
# Do not reintroduce `needs:` between them. Serialising saves one wasted emulator boot
# on a red push and costs a full emulator run on every green one.
jobs:
  # ---------------------------------------------------------------- verify ----
  verify:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK_ROOT" ANDROID_HOME="$SDK_ROOT"
          SDKM="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager -type f 2>/dev/null | sort | tail -n1 || true)"
          if [ -n "$SDKM" ]; then
            yes 2>/dev/null | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-37.2" "build-tools;37.0.0" "platform-tools" >/dev/null || true
          fi
          ls "$SDK_ROOT/platforms" || true
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Static checks
        run: |
          set -o pipefail
          # Lint otherwise writes a report and prints only a one-line failure. Surface each
          # finding as a ::error:: workflow command so it lands in the check-run annotations,
          # which is where an API client can read it without the raw job log.
          ./gradlew :app:lintDebug --stacktrace > lint.log 2>&1 || LINT_EXIT=$?
          echo "=== lint findings ==="
          python3 .github/scripts/report_lint.py || true
          if [ -n "${LINT_EXIT:-}" ]; then
            echo "=== lint log tail ==="
            tail -n 40 lint.log
            echo "=== reports on disk ==="
            ls -la app/build/reports 2>/dev/null || true
            # One annotation carrying the *cause*, not the stack trace: grep the sections
            # that actually name the problem. stdout alone is unreadable through the API.
            SUMMARY="$(grep -E '^\* |What went wrong|Lint found|^e: |Error:|FAILURE' lint.log \
              | head -n 30 | tr '\n' ' ' | tr -s ' ' | cut -c1-6000)"
            if [ -z "$SUMMARY" ]; then
              SUMMARY="$(head -n 30 lint.log | tr '\n' ' ' | tr -s ' ' | cut -c1-6000)"
            fi
            echo "::error title=lint failed::${SUMMARY}"
          fi
          exit "${LINT_EXIT:-0}"

      - name: JVM unit tests
        run: |
          set -o pipefail
          # Robolectric fetches its Android runtime jar (org.robolectric:android-all-*,
          # from Maven Central) on first use, inside the test JVM. A transient fetch
          # failure then fails every Robolectric test with
          # `initializationError: Failed to fetch maven artifact`, which reads like a code
          # failure but is not — it turned a green run red once already. Warm the cache
          # with retries before the real run; a still-broken warm-up leaves the real run to
          # report whatever it actually finds.
          for attempt in 1 2 3; do
            if ./gradlew :app:testDebugUnitTest \
                 --tests 'com.livehub.app.ui.player.DanmakuOverlayTest' \
                 --stacktrace > robolectric-warmup.log 2>&1; then
              echo "Robolectric runtime available (attempt $attempt)"
              break
            fi
            echo "Robolectric warm-up attempt $attempt failed; retrying"
            tail -n 15 robolectric-warmup.log || true
            sleep $((attempt * 10))
          done
          # A failing test otherwise reports only "exit code 1"; the failing class and
          # assertion are surfaced through the XML results so they reach the annotations.
          ./gradlew test --stacktrace > test.log 2>&1 || TEST_EXIT=$?
          python3 .github/scripts/report_tests.py || true
          if [ -n "${TEST_EXIT:-}" ]; then
            echo "=== test log tail ==="
            tail -n 40 test.log
            # The reporter above only covers real assertion failures. A compile error or a
            # missing report file would otherwise stay invisible, so always annotate the
            # cause as well.
            SUMMARY="$(grep -E '^e: |There were failing tests|FAILURE:|What went wrong|error:' test.log \
              | head -n 25 | tr '\n' ' ' | tr -s ' ' | cut -c1-6000)"
            if [ -z "$SUMMARY" ]; then
              SUMMARY="$(tail -n 20 test.log | tr '\n' ' ' | tr -s ' ' | cut -c1-6000)"
            fi
            echo "::error title=unit tests failed::${SUMMARY}"
          fi
          exit "${TEST_EXIT:-0}"

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug apk
        uses: actions/upload-artifact@v4
        with:
          name: livehub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------- release ----
  # Split out of `verify` so R8 runs *alongside* lint and the tests instead of in front of
  # them. It is the most expensive single step of the pipeline (~3 minutes when a change
  # touches sources, ~20s when the build cache already holds the outputs) and nothing in
  # `verify` consumes its result.
  release:
    name: Release assembly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK_ROOT" ANDROID_HOME="$SDK_ROOT"
          SDKM="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager -type f 2>/dev/null | sort | tail -n1 || true)"
          if [ -n "$SDKM" ]; then
            yes 2>/dev/null | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-37.2" "build-tools;37.0.0" "platform-tools" >/dev/null || true
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      # Catches R8 / ProGuard / resource-shrinking breakage that a debug build cannot:
      # minification only runs here. `release.yml` builds the same variant for a tag, so a
      # regression is caught before the release is cut rather than at tag time.
      - name: Assemble release (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace

  # ------------------------------------------------------------- instrument ---
  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The emulator action boots the device first and only then runs the script, so
      # without this step a compile error would burn a full boot before failing. Building
      # here also leaves `connectedDebugAndroidTest` with nothing to do but install and
      # run, which keeps the device's uptime to the part that actually needs a device.
      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runs *inside* the emulator script: the runner tears the device down as soon as
      # this script exits, so the screenshots must be pulled while it is still alive.
      # `|| true` keeps a screenshot failure from masking a real test failure.
      #
      # `google_atd` is Google's "Automated Test Device" image: same framework, no Play
      # Store and stripped system apps, which is what makes it boot noticeably faster than
      # `google_apis`. These tests only reach the Android framework, DataStore and Compose,
      # so they need nothing the full image adds. If the image ever fails to resolve for
      # this API level, `target: google_apis` is the drop-in revert.
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          # The action defaults to 2 cores and a small RAM budget. The runner has 4
          # vCPUs and Gradle is idle while the tests run (the APKs are built above), so
          # the device can have all of them: boot and Compose rendering are the two
          # things that actually cost time here.
          cores: 4
          ram-size: 2048M
          disable-animations: true
          disable-spellchecker: true
          script: |
            set +e
            ./gradlew connectedDebugAndroidTest --stacktrace > "$GITHUB_WORKSPACE/instrumented.log" 2>&1
            TEST_EXIT=$?
            # Surface which test failed: the gradle output alone is unreadable through the
            # API, and a screenshot-test crash otherwise reports only "exit code 1".
            python3 .github/scripts/report_instrumented.py || true
            # ScreenshotTest writes the renders into the shared Download folder, so a
            # plain pull works: pull it inside the script, while the device is still up.
            # The emulator-runner action tears the device down as soon as this script ends.
            mkdir -p "$GITHUB_WORKSPACE/ui-screenshots"
            adb shell ls -la /sdcard/Download/livehub-shots || true
            adb pull /sdcard/Download/livehub-shots "$GITHUB_WORKSPACE/ui-screenshots" || true
            ls -la "$GITHUB_WORKSPACE/ui-screenshots" || true
            exit $TEST_EXIT

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-screenshots/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 14
