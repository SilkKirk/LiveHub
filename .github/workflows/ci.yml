name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep Gradle from writing to the read-only GitHub token path.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  # ---------------------------------------------------------------- verify ----
  verify:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK_ROOT" ANDROID_HOME="$SDK_ROOT"
          SDKM="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager -type f 2>/dev/null | sort | tail -n1 || true)"
          if [ -n "$SDKM" ]; then
            yes 2>/dev/null | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-37.2" "build-tools;37.0.0" "platform-tools" >/dev/null || true
          fi
          ls "$SDK_ROOT/platforms" || true
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Static checks
        run: |
          set -o pipefail
          # Lint otherwise writes a report and prints only a one-line failure, leaving the
          # offending rule and file unreadable from the job log. Echo the report to stdout.
          ./gradlew :app:lintDebug --stacktrace 2>&1 | tee lint.log || LINT_EXIT=$?
          echo "=== lint report ==="
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            cat app/build/reports/lint-results-debug.txt
          fi
          if [ -f app/build/reports/lint-results-debug.xml ]; then
            grep -E '<issue|message=|file=' app/build/reports/lint-results-debug.xml | head -n 200
          fi
          exit "${LINT_EXIT:-0}"

      - name: JVM unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug apk
        uses: actions/upload-artifact@v4
        with:
          name: livehub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------- instrument ---
  instrumented:
    name: Instrumented tests
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runs *inside* the emulator script: the runner tears the device down as soon as
      # this script exits, so the screenshots must be pulled while it is still alive.
      # `|| true` keeps a screenshot failure from masking a real test failure.
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set +e
            ./gradlew connectedDebugAndroidTest --stacktrace
            TEST_EXIT=$?
            # ScreenshotTest writes the renders into the shared Download folder, so a
            # plain pull works: pull it inside the script, while the device is still up.
            # The emulator-runner action tears the device down as soon as this script ends.
            mkdir -p "$GITHUB_WORKSPACE/ui-screenshots"
            adb shell ls -la /sdcard/Download/livehub-shots || true
            adb pull /sdcard/Download/livehub-shots "$GITHUB_WORKSPACE/ui-screenshots" || true
            ls -la "$GITHUB_WORKSPACE/ui-screenshots" || true
            exit $TEST_EXIT

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-screenshots/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 14
